<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>update</title>
    <link rel="stylesheet" href="/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"

          rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <style>

        form{

        background: lightblue;
        width: 50%;
        padding: 12px;
        margin: auto;
        text-align: center;

}


    </style>


</head>
<body>



<form th:action="@{/images/update/{id}(id=${image.id})}"  method="post" enctype="multipart/form-data">


    <h3>Update images</h3><br>


<br>

    <div class="form-group">
        <input type="text" name="name" th:value="${image.file_name}"   required ><br><br>
    </div>

    <div class="form-group">
  <input type="file" name="file" > <br><br>
    </div>

    <div class="form-group">
  <button type="submit"  class="btn btn-info">update</button>
    </div>



</form>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>
</html>
