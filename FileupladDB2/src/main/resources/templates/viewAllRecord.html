<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
<!--    <link rel="stylesheet" href="src/main/resources/static/style.css">-->
</head>
<body>



<table class="table">

    <tr>
        <th scope="col">id</th>
        <th scope="col">image</th>

    </tr>


    <tr th:each="img : ${images}">

        <td th:text="${img.id}">  <span th:text="${img.id}"></span> </td>

        <td >
            <img th:src="@{/images/{id}/data(id=${img.id})}" alt="images" width="150" height="150" class="img-fluid">
<!--            <img th:src="@{/images/{id}/data(id=${img.id})}" alt="Image" width="150">-->
        </td>

        <td><a th:href="@{/images/view/{id}(id=${img.id})}">  <button  class="btn btn-info">view</button> </a></td>
        <td><a th:href="@{/images/update/{id}(id=${img.id})}">  <button     class="btn btn-warning" >Edit</button> </a></td>
        <td><a th:href="@{/images/delete/{id}(id=${img.id})}">  <button  class="btn btn-danger"  >Delete</button> </a></td>


    </tr>


</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script
</body>
</html>
